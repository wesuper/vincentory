<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - 汇报演示</title>

    <!-- 主题样式 -->
    <link rel="stylesheet" href="style.css">

    <!-- CDN 依赖（按需启用） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <!-- 进度条 -->
    <div class="progress-bar"></div>

    <!-- 幻灯片容器：每页一个 .slide -->
    <div class="slide-container">

        <!-- 封面页 -->
        <div class="slide active" data-page="cover">
            <div class="cover-page">
                <div class="cover-decoration">
                    <div class="deco-circle deco-circle-1"></div>
                    <div class="deco-circle deco-circle-2"></div>
                    <div class="deco-circle deco-circle-3"></div>
                    <div class="deco-line deco-line-1"></div>
                    <div class="deco-line deco-line-2"></div>
                </div>
                <div class="cover-badge">{{BADGE}}</div>
                <h1 class="cover-title">{{TITLE}}</h1>
                <p class="cover-subtitle">{{SUBTITLE}}</p>
                <div class="cover-info">
                    <div class="cover-info-item"><span>📅</span> {{DATE}}</div>
                    <div class="cover-info-item"><span>👤</span> {{AUTHOR}}</div>
                    <div class="cover-info-item"><span>🏢</span> {{DEPARTMENT}}</div>
                </div>
            </div>
        </div>

        <!--
            在此处追加更多页面：
            - 目录页：<div class="slide" data-page="toc"> ... </div>
            - 内容页：<div class="slide" data-page="content-1-1"> ... </div>
            - Q&A 页：<div class="slide" data-page="qa"> ... </div>
            - 附录页：<div class="slide" data-page="appendix"> ... </div>
        -->

    </div>

    <!-- 导航 -->
    <div class="navigation">
        <div class="nav-btn" data-action="prev">◀</div>
        <div class="nav-btn" data-action="next">▶</div>
    </div>

    <!-- 页码 -->
    <div class="page-indicator"></div>

    <!-- 主题交互脚本 -->
    <script src="script.js"></script>
</body>
</html>
