<!DOCTYPE html>
<!-- data-theme：默认 light-gradient 蓝色；可选 kraft-paper / dune / ink-classic -->
<html lang="zh-CN" data-theme="{{THEME}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>

    <!-- 可选图表依赖：内网环境加载失败不影响翻页（脚本内有 typeof 保护） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <!-- 样式：结构样式 + 选定主题的皮肤，两段都要内联。
         注意槽位注释里不要写 HTML 注释标记，style 内的 `<!--` 会让浏览器提前结束样式表。 -->
    <style>
        /* === STYLE_CSS === */
        /* deck/style.css：结构令牌 + 组件布局 + 演讲者视图 */

        /* === THEME_CSS === */
        /* deck/themes/{{THEME}}.css：只放选定的那一个主题，不要叠加多个 */
    </style>
</head>

<body>
    <!-- 顶部进度指示条：随翻页增长 -->
    <div class="progress-bar"></div>

    <!-- 幻灯片容器：页面顺序 = DOM 顺序 -->
    <div class="presentation">

        <!-- P1 封面 -->
        <section class="slide active" id="slide-cover" data-slide-id="cover">
            <div class="cover-page">
                <div class="cover-decoration">
                    <div class="deco-circle deco-circle-1"></div>
                    <div class="deco-circle deco-circle-2"></div>
                    <div class="deco-circle deco-circle-3"></div>
                    <div class="deco-line deco-line-1"></div>
                    <div class="deco-line deco-line-2"></div>
                </div>
                <div class="cover-badge">{{BADGE}}</div>
                <h1 class="cover-title">{{PRESENTATION_TITLE}}</h1>
                <p class="cover-subtitle">{{SUBTITLE}}</p>
                <div class="cover-info">
                    <div class="cover-info-item"><span class="ci-k">日期</span> {{DATE}}</div>
                    <div class="cover-info-item"><span class="ci-k">汇报人</span> {{AUTHOR}}</div>
                    <div class="cover-info-item"><span class="ci-k">科室</span> {{DEPARTMENT}}</div>
                </div>
                <!-- 结论先行：3 条以内核心结论胶囊，管理层 3 秒抓住重点 -->
                <div class="cover-chips">
                    {{COVER_CHIPS}}
                </div>
                <div class="cover-hint">← / → 翻页 · F 全屏 · P 演讲者视图</div>
            </div>
        </section>

        <!-- P2 目录：每章一句结论 + 2–3 条要点 -->
        <section class="slide" id="slide-toc" data-slide-id="toc">
            <div class="toc-page">
                <div class="toc-header">
                    <div class="toc-icon">📋</div>
                    <div>
                        <div class="toc-title">目录</div>
                        <div class="toc-subtitle">CONTENTS · {{TOC_TAGLINE}}</div>
                    </div>
                </div>
                <div class="toc-stack">
                    {{TOC_CELLS}}
                </div>
            </div>
        </section>

        <!-- 内容页插槽：按 page-templates.md 的三段式写入；id 与 data-slide-id 都要唯一。
             占位符在整个骨架里只出现这一处——若在注释里再写一遍同名字面量，
             按占位符做全局替换时会把内容页写两遍，出现重复 id。 -->
        {{PAGES}}

        <!-- 收尾页 -->
        <section class="slide" id="slide-end" data-slide-id="closing">
            <div class="qa-page">
                <div class="qa-decoration">
                    <div class="qa-circle qa-circle-1"></div>
                    <div class="qa-circle qa-circle-2"></div>
                </div>
                <div class="qa-icon">{{END_ICON}}</div>
                <div class="close-lines">
                    {{CLOSE_LINES}}
                </div>
                <div class="close-thanks">谢 谢 · 恳 请 指 正</div>
            </div>
        </section>

    </div>

    <!-- 导航：右下轻量平面 + 页码 -->
    <div class="navigation">
        <button class="nav-btn" id="prevBtn" data-action="prev" aria-label="上一页">◀</button>
        <span class="page-indicator"><span id="currentPage">1</span> / <span class="total" id="totalPages">1</span></span>
        <button class="nav-btn" id="nextBtn" data-action="next" aria-label="下一页">▶</button>
    </div>

    <!-- 交互脚本（装配时内联到这里） -->
    <script>
        /* === SCRIPT_JS === */
    </script>

    <!-- 演讲备注：每页一条，id 必须与 section 的 data-slide-id 一致 -->
    <script>
        /* === SPEAKER_NOTES === */
        window.SPEAKER_NOTES = [];
    </script>
</body>

</html>
